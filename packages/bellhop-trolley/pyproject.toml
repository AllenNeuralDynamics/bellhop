[project]
name = "bellhop-trolley"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick Latimer", email = "patrick.latimer@alleninstitute.org" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.42",
    "fsspec[gcs,s3]>=2025.5.1",
    "google-cloud-storage>=3.1.0",
    "pydantic>=2.11.5",
    "universal-pathlib>=0.3.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "moto>=5.0.10"
]

[tool.ruff]
line-length = 120
